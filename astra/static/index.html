<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA 2.0 Web Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon"></div>
                <h1>ASTRA <span>2.0</span></h1>
            </div>
            <nav>
                <div class="nav-item active">Chat</div>
                <div class="nav-item">Capabilities</div>
                <div class="nav-item">Settings</div>
            </nav>
            <div class="system-status">
                <div class="status-dot"></div>
                <span>System Online</span>
            </div>
        </aside>
        
        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h2>Assistant</h2>
                <div class="header-tools">
                    <button id="clear-btn" class="icon-btn" title="Clear Chat">🗑️</button>
                </div>
            </header>
            
            <div id="message-container" class="message-container">
                <div class="message astra">
                    <div class="avatar"></div>
                    <div class="content">
                        Hello! I am ASTRA 2.0. How can I assist you today?
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
